services:
    frontend:
        image: nginx:1.27-alpine
        container_name: frontend
        ports:
        - "8080:80"
        volumes:
        - ./frontend:/usr/share/nginx/html:ro
        restart: unless-stopped
        depends_on:
            - backend
        networks:
            main:
                ipv4_address: 192.168.0.2

    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        container_name: hacknation-backend
        working_dir: /workspace
        environment:
            GOOGLE_WEATHER_API_KEY: "AIzaSyBfNH_F-waErXef28NmfefbAr9gnPhkEVQ"
        volumes:
            - ./backend:/workspace
        ports:
            - "127.0.0.1:8000:8000"
        depends_on:
            - postgres_db
        restart: unless-stopped
        stdin_open: true
        tty: true
        networks:
            main:
                ipv4_address: 192.168.0.3

    postgres_db:
        image: postgres:15
        container_name: hacknation_database
        restart: always
        environment:
            POSTGRES_USER: hacknation_admin
            POSTGRES_PASSWORD: supertajnehaslo123
            POSTGRES_DB: hacknation_db
        ports:
            - "5400:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            main:
                ipv4_address: 192.168.0.4
    
    open-meteo:
        image: ghcr.io/open-meteo/open-meteo
        container_name: open-meteo
        restart: unless-stopped
        environment:
            REMOTE_DATA_DIRECTORY: https://openmeteo.s3.amazonaws.com/data/
            CACHE_SIZE: 16GB
        ports:
            - "127.0.0.1:8080:8080"
        volumes:
            - open-meteo-data:/app/data
        networks:
            main:
                ipv4_address: 192.168.0.5
volumes:
    pgdata:
    open-meteo-data:
networks:
    main:
        ipam:
            config:
                - subnet: 192.168.0.0/24