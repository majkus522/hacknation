services:
    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        container_name: hacknation-backend
        working_dir: /workspace
        volumes:
            - ./backend:/workspace
        ports:
            - "127.0.0.1:8000:8000"
        depends_on:
            imgw_import:
                condition: service_completed_successfully
        restart: unless-stopped
        stdin_open: true
        tty: true
        networks:
            main:
                ipv4_address: 192.168.0.3

    postgres_db:
        image: postgres:15
        container_name: hacknation_database
        restart: always
        environment:
            POSTGRES_USER: hacknation_admin
            POSTGRES_PASSWORD: supertajnehaslo123
            POSTGRES_DB: hacknation_db
        ports:
            - "5400:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            main:
                ipv4_address: 192.168.0.4

    imgw_import:
        image: postgres:15
        environment:
            PGHOST: postgres_db
            PGPORT: "5432"
            PGDATABASE: hacknation_db
            PGUSER: hacknation_admin
            PGPASSWORD: supertajnehaslo123
        volumes:
            - ./imgw_import.sql:/scripts/imgw_import.sql:ro
            - ./backend/scripts/data/imgw/processed:/data:ro
        command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/scripts/imgw_import.sql"]
        depends_on:
            postgres_db:
                condition: service_healthy
        restart: "no"
        networks:
            main:

volumes:
    pgdata:

networks:
    main:
        ipam:
            config:
                - subnet: 192.168.0.0/24
